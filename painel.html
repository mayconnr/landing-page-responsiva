<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel · Adélia &amp; Guga</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00191c">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..900;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/painel.css">
</head>
<body class="panel-page">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9.5 4.6 4.3A1 1 0 0 1 5.55 3.6h12.9a1 1 0 0 1 .95.7L21 9.5"/><path d="M3 9.5h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13.4V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6.6"/><path d="M10 21v-4h4v4"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path transform="translate(7.1 7.1) scale(0.41)" vector-effect="non-scaling-stroke" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  </svg>

  <header class="pbar">
    <a class="pbar__brand" href="index.html" title="Voltar à loja">
      <img src="assets/logo.png" alt="" width="44" height="44">
      <span><strong>Painel</strong><small>Adélia &amp; Guga Mega Hair</small></span>
    </a>
    <div class="pbar__actions">
      <button class="pbtn pbtn--icon" type="button" id="refreshButton" aria-label="Atualizar" hidden><svg class="icon"><use href="#i-refresh"/></svg></button>
      <button class="pbtn" type="button" id="logoutButton" hidden><svg class="icon"><use href="#i-logout"/></svg>Sair</button>
    </div>
  </header>

  <main class="pmain">
    <p class="pdemo" id="panelDemo" hidden>Modo demonstração: pedidos feitos neste navegador. Mesmo assim, só o e-mail autorizado entra.</p>

    <!-- ACESSO DA EQUIPE -->
    <section class="pgate" id="gate" hidden>
      <span class="pgate__icon"><svg class="icon"><use href="#i-lock"/></svg></span>
      <h1>Acesso da equipe</h1>
      <p id="gateText">Acesso restrito. Entre com o e-mail e a senha autorizados.</p>
      <form class="pgate__form" id="gateForm" novalidate>
        <label class="sr-only" for="gateEmail">E-mail</label>
        <input class="pinput" id="gateEmail" name="email" type="email" autocomplete="email" placeholder="E-mail" required>
        <label class="sr-only" for="gatePassword">Senha</label>
        <input class="pinput" id="gatePassword" name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
        <p class="perror" role="alert" hidden></p>
        <button class="pbtn pbtn--gold" type="submit">Entrar no painel</button>
      </form>
      <button class="pbtn" type="button" id="gateLogout" hidden>Sair desta conta</button>
    </section>

    <!-- QUADRO -->
    <section class="board" id="board" hidden>
      <div class="ptabs" role="tablist" aria-label="Seções do painel">
        <button type="button" role="tab" id="tabPedidos" aria-selected="true" aria-controls="viewPedidos">Pedidos <span class="ptabs__count" id="countPedidos"></span></button>
        <button type="button" role="tab" id="tabAgenda" aria-selected="false" aria-controls="viewAgenda">Agenda <span class="ptabs__count" id="countAgenda"></span></button>
      </div>

      <div id="viewPedidos" role="tabpanel" aria-labelledby="tabPedidos">
        <div class="pfilters" id="orderFilters" role="group" aria-label="Filtrar pedidos"></div>
        <div class="plist" id="orderList" aria-live="polite"></div>
      </div>

      <div id="viewAgenda" role="tabpanel" aria-labelledby="tabAgenda" hidden>
        <div class="pfilters" id="agendaFilters" role="group" aria-label="Período da agenda"></div>
        <div class="plist" id="agendaList" aria-live="polite"></div>
      </div>

      <p class="pupdated" id="updatedAt"></p>
    </section>
  </main>

  <div class="ptoast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pedidos.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>

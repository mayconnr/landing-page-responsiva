<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Kit manutenção em casa: shampoo, máscara e leave-in">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#0d5355"/><stop offset=".45" stop-color="#013437"/><stop offset="1" stop-color="#00222a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#2b7a76"/><stop offset=".5" stop-color="#17605f"/><stop offset="1" stop-color="#0c4a4c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3ae"/><stop offset=".45" stop-color="#d9b665"/><stop offset="1" stop-color="#9a7330"/>
    </linearGradient>
  </defs>
  <ellipse cx="166" cy="326" rx="122" ry="10" fill="#013437" opacity=".16"/>
  <!-- leave-in (atrás) -->
  <rect x="192" y="96" width="22" height="22" rx="4" fill="url(#gold)"/>
  <rect x="186" y="84" width="40" height="16" rx="6" fill="#00222a"/>
  <rect x="222" y="88" width="16" height="6" rx="3" fill="#00222a"/>
  <rect x="180" y="116" width="58" height="150" rx="22" fill="url(#teal)"/>
  <rect x="188" y="124" width="7" height="128" rx="3.5" fill="#fff" opacity=".14"/>
  <!-- shampoo -->
  <rect x="104" y="70" width="10" height="34" fill="#00222a"/>
  <rect x="86" y="62" width="58" height="13" rx="5" fill="#00222a"/>
  <rect x="138" y="65" width="30" height="7" rx="3.5" fill="#00222a"/>
  <rect x="96" y="100" width="34" height="18" rx="5" fill="url(#gold)"/>
  <rect x="70" y="114" width="86" height="208" rx="26" fill="url(#body)"/>
  <rect x="79" y="126" width="8" height="182" rx="4" fill="#fff" opacity=".13"/>
  <rect x="82" y="182" width="62" height="88" rx="8" fill="url(#gold)"/>
  <ellipse cx="113" cy="216" rx="11" ry="18" fill="none" stroke="#013437" stroke-width="2.5"/>
  <rect x="96" y="246" width="34" height="3" rx="1.5" fill="#013437" opacity=".7"/>
  <rect x="102" y="254" width="22" height="3" rx="1.5" fill="#013437" opacity=".5"/>
  <!-- máscara (frente) -->
  <rect x="166" y="244" width="112" height="26" rx="7" fill="url(#gold)"/>
  <rect x="172" y="266" width="100" height="58" rx="14" fill="url(#body)"/>
  <rect x="172" y="282" width="100" height="22" fill="#cfe9e1"/>
  <ellipse cx="222" cy="293" rx="6" ry="9" fill="none" stroke="#013437" stroke-width="2"/>
  <rect x="180" y="250" width="40" height="5" rx="2.5" fill="#fff" opacity=".35"/>
